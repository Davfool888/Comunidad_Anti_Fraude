name: Verificación

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Compilar y comprobar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos, lint y compilación
        run: npm test

      - name: Subir el paquete compilado
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
